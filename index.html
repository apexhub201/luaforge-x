<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUAUFORGE X - Lua/Luau Obfuscator</title>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #07090d;
        color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="text/babel">
      function App() {
        const [source, setSource] = React.useState('-- Paste your Lua code here\nprint("Hello World")');
        const [output, setOutput] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        
        const handleObfuscate = () => {
          setIsProcessing(true);
          
          setTimeout(() => {
            // Simple obfuscation
            const result = '--[[ LUAUFORGE X Obfuscated ]]\n' + source;
            setOutput(result);
            setIsProcessing(false);
          }, 500);
        };
        
        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
            {/* Header */}
            <header style={{
              padding: '16px 20px',
              borderBottom: '1px solid #1a1f2e',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
            }}>
              <div>
                <h1 style={{ fontSize: '20px', fontWeight: 'bold' }}>
                  ⚡ LUAUFORGE X
                </h1>
                <p style={{ fontSize: '12px', color: '#6b7280' }}>
                  Advanced Lua/Luau Virtualization Engine
                </p>
              </div>
              <span style={{
                padding: '4px 12px',
                background: 'rgba(34, 197, 94, 0.1)',
                color: '#22c55e',
                borderRadius: '9999px',
                fontSize: '12px',
                border: '1px solid rgba(34, 197, 94, 0.3)',
              }}>
                ● ONLINE
              </span>
            </header>
            
            {/* Main */}
            <main style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', padding: '20px' }}>
              {/* Source */}
              <div style={{
                background: '#0a0d14',
                border: '1px solid #1a1f2e',
                borderRadius: '12px',
                overflow: 'hidden',
              }}>
                <div style={{
                  padding: '12px 16px',
                  borderBottom: '1px solid #1a1f2e',
                  fontWeight: '600',
                  fontSize: '14px',
                }}>
                  SOURCE CODE
                </div>
                <textarea
                  value={source}
                  onChange={(e) => setSource(e.target.value)}
                  style={{
                    width: '100%',
                    height: '400px',
                    background: '#0d1117',
                    color: '#e5e7eb',
                    border: 'none',
                    outline: 'none',
                    padding: '16px',
                    fontFamily: 'monospace',
                    fontSize: '14px',
                    resize: 'vertical',
                  }}
                />
              </div>
              
              {/* Output */}
              <div style={{
                background: '#0a0d14',
                border: '1px solid #1a1f2e',
                borderRadius: '12px',
                overflow: 'hidden',
              }}>
                <div style={{
                  padding: '12px 16px',
                  borderBottom: '1px solid #1a1f2e',
                  fontWeight: '600',
                  fontSize: '14px',
                }}>
                  OUTPUT
                </div>
                <textarea
                  value={output}
                  readOnly
                  placeholder="// Obfuscated output will appear here..."
                  style={{
                    width: '100%',
                    height: '400px',
                    background: '#0d1117',
                    color: '#00d4ff',
                    border: 'none',
                    outline: 'none',
                    padding: '16px',
                    fontFamily: 'monospace',
                    fontSize: '14px',
                    resize: 'vertical',
                  }}
                />
              </div>
            </main>
            
            {/* Actions */}
            <div style={{
              display: 'flex',
              justifyContent: 'center',
              gap: '12px',
              padding: '20px',
            }}>
              <button
                onClick={handleObfuscate}
                disabled={isProcessing}
                style={{
                  padding: '12px 32px',
                  background: isProcessing ? '#1a1f2e' : '#00d4ff',
                  color: isProcessing ? '#6b7280' : '#000',
                  border: 'none',
                  borderRadius: '8px',
                  cursor: isProcessing ? 'not-allowed' : 'pointer',
                  fontWeight: 'bold',
                  fontSize: '15px',
                }}
              >
                {isProcessing ? '⏳ BUILDING...' : '⚡ OBFUSCATE'}
              </button>
            </div>
          </div>
        );
      }
      
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
